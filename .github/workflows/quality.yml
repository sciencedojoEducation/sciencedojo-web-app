name: Build and regression checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install campus service dependencies
        run: npm ci --prefix services/campus-server

      - name: Run regression tests
        run: npm test

      - name: Check clean campus service release and restart
        timeout-minutes: 5
        env:
          TMPDIR: ${{ runner.temp }}
        run: npm run test:campus:release

      - name: Save campus service release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campus-service-release
          path: |
            ${{ runner.temp }}/sciencedojo-campus-release-*/campus-service.tar.gz
            ${{ runner.temp }}/sciencedojo-campus-release-*/campus-service.sha256
            ${{ runner.temp }}/sciencedojo-campus-release-*/evidence.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Install campus browser
        run: npx playwright install --with-deps chromium

      - name: Check optional campus beta in Chromium
        timeout-minutes: 15
        env:
          TMPDIR: ${{ runner.temp }}
        run: npm run test:campus:browser

      - name: Check shared SQL campus transport in Chromium
        timeout-minutes: 15
        env:
          TMPDIR: ${{ runner.temp }}
        run: npm run test:campus:vercel:browser

      - name: Save synthetic campus browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtual-sciencedojo-browser-evidence
          path: |
            ${{ runner.temp }}/sciencedojo-campus-browser-*/evidence.json
            ${{ runner.temp }}/sciencedojo-campus-browser-*/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Check campus render budget and smooth movement
        timeout-minutes: 3
        env:
          TMPDIR: ${{ runner.temp }}
        run: npm run test:campus:render && npm run test:campus:render -- --reduced-motion

      - name: Save synthetic campus render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtual-sciencedojo-render-evidence
          path: |
            ${{ runner.temp }}/campus-render-*/evidence.json
            ${{ runner.temp }}/campus-render-*/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Type-check
        run: npm run typecheck

      - name: Lint latency hotfix files
        run: npm run lint:latency

      - name: Build production application
        run: npm run build

      - name: Verify private workbook build traces
        run: node scripts/verify-aspekte-build.mjs
