name: Build and regression checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Lint native admin workbook files
        run: npx eslint components/workbook/AspekteWorkbook.tsx components/workbook/NativeWorkbookExercise.tsx components/workbook/IntensivtrainerBook.tsx components/workbook/useTrainerAccount.ts lib/intensivtrainer.ts lib/intensivtrainer-server.ts lib/intensivtrainer-membership.ts lib/intensivtrainer-assets.ts tests/intensivtrainer-membership.test.mjs app/api/workbook/aspekte-neu-b2-intensivtrainer app/workbooks/aspekte-neu-b2-intensivtrainer scripts/audit-intensivtrainer.mjs scripts/verify-intensivtrainer.mjs scripts/verify-intensivtrainer-build.mjs scripts/verify-intensivtrainer-cloud.mjs scripts/verify-intensivtrainer-accounts.mjs scripts/publish-intensivtrainer-private.mjs

      - name: Lint private Lehrbuch files
        run: npx eslint components/workbook/LehrbuchBook.tsx lib/lehrbuch.ts lib/lehrbuch-server.ts app/api/workbook/aspekte-neu-b2-lehrbuch scripts/lehrbuch-native-package.mjs scripts/publish-lehrbuch-private.mjs tests/lehrbuch-native.test.mjs

      - name: Lint latency hotfix files
        run: npm run lint:latency

      - name: Lint engineering page files
        run: npm run lint:engineering

      - name: Build production application
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://synthetic.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-public-key
        run: npm run build

      - name: Install Chromium for engineering acceptance
        run: npx playwright install --with-deps chromium

      - name: Check engineering page in Chromium
        timeout-minutes: 5
        env:
          TMPDIR: ${{ runner.temp }}
        run: npm run test:engineering:browser

      - name: Save synthetic engineering browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-browser-evidence
          path: |
            ${{ runner.temp }}/sciencedojo-engineering-browser-*/evidence.json
            ${{ runner.temp }}/sciencedojo-engineering-browser-*/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify private workbook build traces
        run: node scripts/verify-aspekte-build.mjs

      - name: Verify native Intensivtrainer build traces
        run: node scripts/verify-intensivtrainer-build.mjs
